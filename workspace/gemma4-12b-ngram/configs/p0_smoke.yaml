experiment:
  name: p0_smoke
  seed: 20260911
  phase: P0

model:
  id: google/gemma-4-12B
  revision: main  # 첫 다운로드 후 실제 commit SHA로 고정할 것
  dtype: bfloat16
  text_only: true
  freeze_backbone: true
  use_cache: false
  gradient_checkpointing: true
  injection:
    after_decoder_block_one_based: 2
    huggingface_module_index: 1

ngram_adapter:
  orders: [2, 3]
  heads_per_order: 8
  slots_per_head: 65536  # 2^16; P0에서 키우지 말 것
  embedding_dim_per_head: 160
  concatenated_dim: 2560
  projection_dim: 3840
  hash:
    algorithm: stable_hash64_v1
    bucket_method: power_of_two_bitmask
    seed_base: 20260911
    forbid_python_builtin_hash: true
  boundary_id: 262144  # tokenizer vocab 밖의 adapter 전용 값
  gate:
    function: tanh
    initial_effective_scale: 0.01

data:
  dataset: HuggingFaceFW/fineweb-2
  language_config: kor_Hang
  dataset_revision: null  # shard 생성 전 실제 SHA 필수
  train_tokens: 10000000
  validation_tokens: 2000000
  sequence_length: 1024
  packed_documents: true
  cross_document_ngrams: false
  pretokenized_dtype: uint32
  local_shards_required: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  effective_tokens_per_update: 16384
  max_updates: 610
  table_optimizer:
    type: sparse_sgd
    learning_rate: 0.05
    momentum: 0.0
    weight_decay: 0.0
  dense_adapter_optimizer:
    type: adamw
    learning_rate: 0.001
    betas: [0.9, 0.95]
    weight_decay: 0.01
  scheduler:
    type: cosine
    warmup_updates: 30
  dense_gradient_clip_norm: 1.0

evaluation:
  baseline_adapter_off: true
  every_updates: 100
  primary_metric: mean_nll_nat_per_token
  report_perplexity: true

checkpoint:
  adapter_only: true
  every_updates: 200
  keep_last: 2
  save_optimizer_state: true
  verify_resume_loss: true

logging:
  every_updates: 10
  format: jsonl
  record_cuda_peak_memory: true
  record_process_rss: true
  record_tokens_per_second: true
  record_backbone_checksums: true

guards:
  abort_on_non_finite: true
  assert_only_adapter_trainable: true
  require_causality_test: true
  require_hash_golden_test: true
  unified_memory_hard_stop_gib: 115
